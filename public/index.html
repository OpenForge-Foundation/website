<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenForge Foundation</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f4f1;
        --fg: #2b4356;
        --muted: #6b7f8f;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        text-align: center;
        padding: 1.5rem;
      }

      main {
        max-width: 32rem;
      }

      img {
        width: 16rem;
        max-width: 80vw;
        margin-bottom: 1.5rem;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
      }

      p {
        font-size: 1.1rem;
        color: var(--muted);
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo.svg" alt="OpenForge Foundation" />
      <h1 class="sr-only">OpenForge Foundation</h1>
      <p>More to come.</p>
    </main>
  </body>
</html>
